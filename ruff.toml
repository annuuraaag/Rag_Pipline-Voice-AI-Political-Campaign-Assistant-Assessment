line-length = 130
target-version = "py311"

[lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
  "E501",  # long strings in prompts/docstrings
  "E702",  # compact statements in the sample-doc build script
  "B008",  # FastAPI's Depends()/File() in defaults is the framework idiom
]

[lint.isort]
known-first-party = ["app", "tests"]
