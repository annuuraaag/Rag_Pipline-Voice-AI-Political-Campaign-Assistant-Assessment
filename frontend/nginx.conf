# Upgrade only WebSocket requests; plain requests keep a normal keep-alive connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;              # WebSocket (/api/ws/voice)
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;                                 # deliver SSE tokens immediately
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    location /assets/ {
        expires 1y;          # hashed filenames: safe to cache
    }

    location / {
        expires -1;          # index.html always revalidated
        try_files $uri /index.html;
    }
}
