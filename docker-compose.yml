# One-command stack:  docker compose up --build
#   UI      → http://localhost:5173
#   API     → http://localhost:8000/docs
#   Qdrant  → http://localhost:6333/dashboard
name: campaign-voice-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1          # pinned to match qdrant-client 1.19.x
    ports:
      - "127.0.0.1:6333:6333"   # Qdrant has no auth: reachable from this machine only
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SPEECH_MODELS: ${SPEECH_MODELS:-true}   # bake the local speech models into the image
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      # Server-side speech on CPU by default; set to none to leave speech to the browser.
      STT_PROVIDER: ${STT_PROVIDER:-local}
      TTS_PROVIDER: ${TTS_PROVIDER:-local}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/data
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_data:
  backend_data:
